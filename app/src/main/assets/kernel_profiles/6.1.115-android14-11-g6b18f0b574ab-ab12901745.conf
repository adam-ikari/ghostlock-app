# GhostLock kernel profile: 6.1.115-android14-11-g6b18f0b574ab-ab12901745 (HOCON).
# Unihertz Titan 2 (MediaTek MT6878 / Dimensity 7300), stock international (TEE)
# firmware 1.00 and 1.00.07 (the 1.00.10 update moves to 6.1.145).
# Offsets extracted from the stock boot.img with tools/extract_rs (kallsyms + BTF).
# route "tcp_zerocopy" (android14-6.1 compact waiter), fallback "select_stack"
# with the waiter shift derived from this kernel's pselect chain.
include "credential-6x.conf"
include "kernelsnitch-6x.conf"
release = "6.1.115-android14-11-g6b18f0b574ab-ab12901745"
schema_version = 1
kernel_major = 6
recommend_shizuku = 0
# vendor_boot.img kernel_addr; kernel text is loaded at the DRAM base
kernel_phys_load = 1073741824
# DRAM base from the device tree in vendor_boot.img: /memory@40000000
kernel_phys_offset = 1073741824
route {
  tcp_zerocopy {
    compact_waiter = 1
  }
}
fallback {
  to = "select_stack"
  route {
    select_stack {
      waiter_shift = 1
    }
  }
}
kernelsnitch {
  mm_struct_sz = 1024
}
task_struct {
  prio = 132
  normal_prio = 140
  sched_task_group = 840
  pi_lock = 2340
  pi_waiters = 2360
  pi_top_task = 2376
  pi_blocked_on = 2384
  pid = 1584
  tgid = 1588
  atomic_flags = 1520
  real_cred = 2096
  cred = 2104
  comm = 2120
  tasks = 1360
  seccomp = 2304
}
offset {
  init_task = 33355264
  init_cred = 33430312
  empty_zero_page = 35315712
  root_task_group = 35345792
  selinux_enforcing = 35681232
  selinux_blob_sizes = 22680072
